name: Python application

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.14.1 mypy==1.19.1 uv pytest types-tqdm
          python -m pip install "ta-lib==0.6.4" --index-url https://pypi.vnpy.com
          # The alpha extra carries lightgbm, polars, scipy, pyarrow and the
          # rest of the research dependencies, so the alpha tests are not
          # skipped for a missing module.
          python -m pip install -e ".[dev,alpha]" statsmodels matplotlib
          python -m pip install vnpy_sqlite
          python -m pip install vnpy_ctastrategy
          python -m pip install vnpy_paperaccount

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy vnpy

      - name: Test
        run: python -m pytest tests

      - name: Build
        run: uv build
